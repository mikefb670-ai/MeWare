<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Konzeptzeichnungen - MeWare</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background-color: #1e293b;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #334155;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-left { display: flex; align-items: center; gap: 30px; }
        .logo { font-size: 24px; font-weight: bold; color: #38bdf8; letter-spacing: 1px; text-decoration: none; }
        
        nav { display: flex; gap: 20px; align-items: center; }
        nav a { color: #94a3b8; text-decoration: none; transition: color 0.3s; font-size: 16px; }
        nav a:hover, nav a.active { color: #38bdf8; }

        /* Dropdown Menü */
        .dropdown { position: relative; display: inline-block; }
        .dropdown-content {
            display: none; position: absolute; background-color: #1e293b;
            min-width: 180px; box-shadow: 0px 8px 16px rgba(0,0,0,0.3);
            z-index: 1; border: 1px solid #334155; border-radius: 6px; overflow: hidden; top: 100%; left: 0;
        }
        .dropdown-content a { color: #94a3b8; padding: 12px 16px; text-decoration: none; display: block; font-size: 15px; }
        .dropdown-content a:hover { background-color: #0f172a; color: #38bdf8; }
        .dropdown:hover .dropdown-content { display: block; }

        main { flex: 1; max-width: 1200px; width: 100%; margin: 0 auto; padding: 60px 20px; }
        h1 { font-size: 38px; margin-bottom: 30px; color: #38bdf8; border-left: 4px solid #38bdf8; padding-left: 15px; }

        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 30px; }
        
        /* Wird dynamisch per JavaScript befüllt */
        .gallery-card {
            background-color: #1e293b; border: 1px solid #334155; border-radius: 8px;
            overflow: hidden; cursor: pointer; transition: transform 0.2s, border-color 0.2s;
        }
        .gallery-card:hover { border-color: #38bdf8; transform: translateY(-4px); }

        .gallery-img-container { width: 100%; height: 200px; background-color: #0f172a; overflow: hidden; }
        .gallery-img-container img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.3s; }
        .gallery-card:hover img { transform: scale(1.05); }

        .gallery-info { padding: 20px; }
        .gallery-info p.desc { color: #f8fafc; font-size: 16px; margin-bottom: 10px; }
        .gallery-info p.game-tag { color: #38bdf8; font-size: 14px; font-weight: bold; text-transform: uppercase; }

        /* Lightbox (Vorschau im Großformat) */
        .lightbox {
            display: none; position: fixed; z-index: 1000; top: 0; left: 0;
            width: 100%; height: 100%; background-color: rgba(15, 23, 42, 0.95);
            justify-content: center; align-items: center; flex-direction: column;
        }
        .lightbox img { max-width: 80%; max-height: 75vh; border-radius: 8px; border: 2px solid #38bdf8; }
        .lightbox-caption { color: #f8fafc; margin-top: 15px; font-size: 18px; text-align: center; }
        .lightbox-close { position: absolute; top: 30px; right: 40px; font-size: 40px; color: #f8fafc; cursor: pointer; }
        .lightbox-close:hover, .lightbox-arrow:hover { color: #38bdf8; }
        .lightbox-arrow {
            position: absolute; top: 50%; transform: translateY(-50%);
            font-size: 40px; color: #f8fafc; background: none; border: none; cursor: pointer; padding: 20px;
        }
        .lightbox-prev { left: 20px; }
        .lightbox-next { right: 20px; }

        footer { text-align: center; padding: 20px; background-color: #1e293b; color: #94a3b8; font-size: 14px; border-top: 1px solid #334155; margin-top: auto; }
    </style>
</head>
<body>

    <header>
        <div class="header-left">
            <a href="index.html" class="logo">MeWare</a>
            <nav>
                <a href="games.html">Spiele</a>
                <div class="dropdown">
                    <a href="#" class="dropbtn" style="color: #38bdf8;">Inhalte <i class="fa-solid fa-chevron-down" style="font-size: 12px;"></i></a>
                    <div class="dropdown-content">
                        <a href="konzeptzeichnungen.html" style="color: #38bdf8;">Konzeptzeichnungen</a>
                    </div>
                </div>
            </nav>
        </div>
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">Über uns</a>
        </nav>
    </header>

    <main>
        <h1>Konzeptzeichnungen</h1>
        
        <div class="gallery-grid"></div>
    </main>

    <div id="lightbox" class="lightbox">
        <span class="lightbox-close" onclick="closeLightbox()">&times;</span>
        <button class="lightbox-arrow lightbox-prev" onclick="changeImage(-1)"><i class="fa-solid fa-chevron-left"></i></button>
        <img id="lightbox-img" src="" alt="">
        <div id="lightbox-caption" class="lightbox-caption"></div>
        <button class="lightbox-arrow lightbox-next" onclick="changeImage(1)"><i class="fa-solid fa-chevron-right"></i></button>
    </div>

    <footer>
        &copy; 2026 MeWare. Alle Rechte vorbehalten.
    </footer>

    <script>
        // =========================================================================
        // HIER KANNST DU GANZ EINFACH NEUE SACHEN HINZUFÜGEN ODER ÄNDERN:
        // =========================================================================
        const galleryData = [
            {
                src: "boss1.jpeg",
                desc: "Konzeptzeichnung für Boss 1.",
                game: "Karate Katze"
            },
            {
                src: "boss2.jpeg",
                desc: "Konzeptzeichnung für Boss 2.",
                game: "Karate Katze"
            },
            {
                src: "boss3.jpeg",
                desc: "Konzeptzeichnung für Boss 3.",
                game: "Karate Katze"
            },
            {
                src: "judopinguin.jpeg",
                desc: "Konzeptzeichnung für JP.",
                game: "Karate Katze"
            },
            {
                src: "moonsun.jpeg",
                desc: "Konzeptzeichnung für Sun / Moon.",
                game: "Karate Katze"
            }
            // SPÄTER EINFACH HIER WEITERSCHREIBEN MIT KOMMA AM ENDE:
            // , { src: "neues-bild.jpeg", desc: "Beschreibung...", game: "Karate Katze" }
        ];

        // Automatische Generierung der Karten im HTML:
        const gridContainer = document.querySelector('.gallery-grid');
        gridContainer.innerHTML = "";

        galleryData.forEach((item, index) => {
            gridContainer.innerHTML += `
                <div class="gallery-card" onclick="openLightbox(${index})">
                    <div class="gallery-img-container">
                        <img src="${item.src}" alt="${item.desc}">
                    </div>
                    <div class="gallery-info">
                        <p class="desc">${item.desc}</p>
                        <p class="game-tag"><i class="fa-solid fa-gamepad"></i> ${item.game}</p>
                    </div>
                </div>
            `;
        });

        // Lightbox-Steuerung (Vorschau & Pfeile)
        let currentIndex = 0;

        function openLightbox(index) {
            currentIndex = index;
            updateLightbox();
            document.getElementById('lightbox').style.display = 'flex';
        }

        function closeLightbox() {
            document.getElementById('lightbox').style.display = 'none';
        }

        function changeImage(direction) {
            currentIndex += direction;
            if (currentIndex < 0) {
                currentIndex = galleryData.length - 1;
            } else if (currentIndex >= galleryData.length) {
                currentIndex = 0;
            }
            updateLightbox();
        }

        function updateLightbox() {
            const item = galleryData[currentIndex];
            document.getElementById('lightbox-img').src = item.src;
            document.getElementById('lightbox-caption').innerText = `${item.desc} (Spiel: ${item.game})`;
        }
    </script>
</body>
</html>
