<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MeWare - Indie Game Development</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background-color: #1e293b;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #334155;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-left { display: flex; align-items: center; gap: 30px; }
        .logo { font-size: 24px; font-weight: bold; color: #38bdf8; letter-spacing: 1px; text-decoration: none; }
        
        nav { display: flex; gap: 20px; align-items: center; }
        nav a { color: #94a3b8; text-decoration: none; transition: color 0.3s; font-size: 16px; }
        nav a:hover, nav a.active { color: #38bdf8; }

        /* Dropdown Menü */
        .dropdown { position: relative; display: inline-block; }
        .dropdown-content {
            display: none; position: absolute; background-color: #1e293b;
            min-width: 180px; box-shadow: 0px 8px 16px rgba(0,0,0,0.3);
            z-index: 1; border: 1px solid #334155; border-radius: 6px; overflow: hidden; top: 100%; left: 0;
        }
        .dropdown-content a { color: #94a3b8; padding: 12px 16px; text-decoration: none; display: block; font-size: 15px; }
        .dropdown-content a:hover { background-color: #0f172a; color: #38bdf8; }
        .dropdown:hover .dropdown-content { display: block; }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 120px 20px;
            max-width: 800px;
            margin: 0 auto;
        }

        h1 { font-size: 48px; margin-bottom: 20px; }
        p { font-size: 18px; color: #94a3b8; margin-bottom: 40px; }

        .btn {
            background-color: #38bdf8;
            color: #0f172a;
            padding: 12px 30px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            transition: transform 0.2s, opacity 0.2s;
        }
        .btn:hover { opacity: 0.9; transform: translateY(-2px); }

        footer {
            text-align: center;
            padding: 20px;
            background-color: #1e293b;
            color: #94a3b8;
            font-size: 14px;
            border-top: 1px solid #334155;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-left">
            <a href="index.html" class="logo">MeWare</a>
            <nav>
                <a href="games.html">Spiele</a>
                <div class="dropdown">
                    <a href="#" class="dropbtn">Inhalte <i class="fa-solid fa-chevron-down" style="font-size: 12px;"></i></a>
                    <div class="dropdown-content">
                        <a href="konzeptzeichnungen.html">Konzeptzeichnungen</a>
                    </div>
                </div>
            </nav>
        </div>
        <nav>
            <a href="index.html" class="active">Home</a>
            <a href="about.html">Über uns</a>
        </nav>
    </header>

    <main>
        <section id="home" class="hero">
            <h1>Willkommen bei MeWare</h1>
            <p>Wir sind ein Indie-Entwicklerteam und erschaffen mit viel Herzblut spannende Spiele. Begleitet uns auf unserer Reise!</p>
            <a href="games.html" class="btn">Zu unseren Spielen</a>
        </section>
    </main>

    <footer>
        &copy; 2026 MeWare. Alle Rechte vorbehalten.
    </footer>

</body>
</html>
