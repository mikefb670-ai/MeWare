<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spiele - MeWare</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background-color: #1e293b;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #334155;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-left { display: flex; align-items: center; gap: 30px; }
        .logo { font-size: 24px; font-weight: bold; color: #38bdf8; letter-spacing: 1px; text-decoration: none; }
        
        nav { display: flex; gap: 20px; align-items: center; }
        nav a { color: #94a3b8; text-decoration: none; transition: color 0.3s; font-size: 16px; }
        nav a:hover, nav a.active { color: #38bdf8; }

        /* Dropdown Menü */
        .dropdown { position: relative; display: inline-block; }
        .dropdown-content {
            display: none; position: absolute; background-color: #1e293b;
            min-width: 180px; box-shadow: 0px 8px 16px rgba(0,0,0,0.3);
            z-index: 1; border: 1px solid #334155; border-radius: 6px; overflow: hidden; top: 100%; left: 0;
        }
        .dropdown-content a { color: #94a3b8; padding: 12px 16px; text-decoration: none; display: block; font-size: 15px; }
        .dropdown-content a:hover { background-color: #0f172a; color: #38bdf8; }
        .dropdown:hover .dropdown-content { display: block; }

        main { flex: 1; max-width: 1000px; width: 100%; margin: 0 auto; padding: 60px 20px; }
        h1 { font-size: 38px; margin-bottom: 30px; color: #38bdf8; border-left: 4px solid #38bdf8; padding-left: 15px; }

        .game-list { display: flex; flex-direction: column; gap: 20px; }
        .game-card {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 30px;
            display: flex;
            align-items: center;
            gap: 30px;
            text-decoration: none;
            color: inherit;
            transition: transform 0.2s, border-color 0.2s;
        }
        .game-card:hover { border-color: #38bdf8; transform: translateY(-2px); }

        .game-icon {
            width: 80px; height: 80px; background-color: #0f172a; border-radius: 6px;
            display: flex; align-items: center; justify-content: center; font-size: 32px;
            color: #38bdf8; border: 1px solid #334155; flex-shrink: 0;
        }

        .game-info h2 { font-size: 24px; margin-bottom: 8px; color: #f8fafc; }
        .game-info p { color: #94a3b8; font-size: 16px; margin-bottom: 15px; }
        .status-badge {
            display: inline-block; background-color: rgba(56, 189, 248, 0.1);
            color: #38bdf8; padding: 4px 10px; border-radius: 4px; font-size: 12px; font-weight: bold; text-transform: uppercase;
        }

        footer { text-align: center; padding: 20px; background-color: #1e293b; color: #94a3b8; font-size: 14px; border-top: 1px solid #334155; }
    </style>
</head>
<body>

    <header>
        <div class="header-left">
            <a href="index.html" class="logo">MeWare</a>
            <nav>
                <a href="games.html" class="active">Spiele</a>
                <div class="dropdown">
                    <a href="#" class="dropbtn">Inhalte <i class="fa-solid fa-chevron-down" style="font-size: 12px;"></i></a>
                    <div class="dropdown-content">
                        <a href="konzeptzeichnungen.html">Konzeptzeichnungen</a>
                    </div>
                </div>
            </nav>
        </div>
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">Über uns</a>
        </nav>
    </header>

    <main>
        <h1>Unsere Spiele</h1>
        <div class="game-list">
            <a href="karate-katze.html" class="game-card">
                <div class="game-icon"><i class="fa-solid fa-gamepad"></i></div>
                <div class="game-info">
                    <h2>Karate Katze</h2>
                    <p>Hier entsteht euer erstes episches Spiel. Aktuell arbeiten wir mit Hochdruck an den Texturen und den Kern-Mechaniken.</p>
                    <span class="status-badge">In Entwicklung</span>
                </div>
            </a>
        </div>
    </main>

    <footer>
        &copy; 2026 MeWare. Alle Rechte vorbehalten.
    </footer>

</body>
</html>
